<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Web Screen Assistant & Auto-Clicker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-6">

  <div class="w-full max-w-3xl space-y-6">
    <header class="text-center">
      <h1 class="text-3xl font-bold text-blue-400">Gemini Web Screen Assistant</h1>
      <p class="text-sm text-gray-400 mt-1">Multi-Key Rotation Assistant (Double Rate Limit: 30 RPM)</p>
    </header>

    <!-- Controls -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2" for="userPrompt">
          Prompt
        </label>
        <input 
          type="text" 
          id="userPrompt" 
          value='Analyze this screen capture and explain the key information clearly. Only give me answers fastly. Only give me like this: "{answer same as in the picture}" i mean only answers.' 
          class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-gray-200"
        />
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button 
          id="selectBtn" 
          type="button"
          class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
        >
          Select Tab / Screen
        </button>

        <button 
          id="resendBtn" 
          type="button"
          disabled
          class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-700 disabled:text-gray-500 disabled:cursor-not-allowed text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
        >
          Take & Send Again (Space / Enter)
        </button>
      </div>
    </div>

    <!-- Screen Preview & Output Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md flex flex-col">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Captured Frame</h2>
        <div class="flex-1 bg-gray-900 border border-gray-700 rounded-lg overflow-hidden flex items-center justify-center min-h-[220px]">
          <video id="video" class="hidden max-h-full max-w-full object-contain" autoplay muted></video>
          <img id="previewImg" class="hidden max-h-full max-w-full object-contain" alt="Screen Capture Preview" />
          <span id="previewPlaceholder" class="text-gray-500 text-sm">No capture yet</span>
        </div>
      </div>

      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md flex flex-col">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Gemini 3.8 Flash Answer</h2>
        <div id="outputBox" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-4 text-sm text-gray-300 overflow-y-auto max-h-[300px] whitespace-pre-wrap font-sans">
          Click 'Select Tab / Screen' to begin.
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    // Paste your Gemini API key(s) here. You can add one or multiple keys in the array for rotation.
    const API_KEYS = [
      "AQ.Ab8RN6LyJy6mlt6OQy3qn_Sb5dUG35jhP1DICcyHVb7iupkj9A",
      "AQ.Ab8RN6K2hEQ-G20o1wD8nCiCImjXNUr2yGusnzqaRg96p6JewA"
    ];

    let activeStream = null;
    let currentKeyIndex = 0;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("selectBtn").addEventListener("click", selectAndCapture);
      document.getElementById("resendBtn").addEventListener("click", captureCurrentFrame);
    });

    window.addEventListener("keydown", (e) => {
      const activeElement = document.activeElement;
      const isInput = activeElement && (activeElement.tagName === "INPUT" || activeElement.tagName === "TEXTAREA");
      
      if (!isInput && (e.code === "Space" || e.code === "Enter")) {
        e.preventDefault();
        const resendBtn = document.getElementById("resendBtn");
        if (!resendBtn.disabled) {
          captureCurrentFrame();
        }
      }
    });

    function getNextApiKey() {
      const keys = API_KEYS.map(k => k.trim()).filter(k => k.length > 0 && !k.startsWith("YOUR_GEMINI_API_KEY"));

      if (keys.length === 0) return null;

      const selectedKey = keys[currentKeyIndex % keys.length];
      currentKeyIndex++;
      return { key: selectedKey, index: (currentKeyIndex - 1) % keys.length + 1, total: keys.length };
    }

    async function selectAndCapture() {
      const keyObj = getNextApiKey();
      const outputBox = document.getElementById("outputBox");

      if (!keyObj) {
        outputBox.innerText = "Error: Please configure at least one valid API Key in the API_KEYS array inside the script.";
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        outputBox.innerText = "Error: Screen capture API is not available. Ensure you are on HTTPS and using Chrome, Edge, or Brave on desktop.";
        return;
      }

      try {
        outputBox.innerText = "Waiting for screen selection...";

        if (activeStream) {
          activeStream.getTracks().forEach(track => track.stop());
        }

        activeStream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "browser" },
          audio: false
        });

        activeStream.getVideoTracks()[0].onended = () => {
          document.getElementById("resendBtn").disabled = true;
          outputBox.innerText = "Screen share stopped. Click 'Select Tab / Screen' to select again.";
        };

        const video = document.getElementById("video");
        video.srcObject = activeStream;

        await video.play();
        await new Promise((resolve) => {
          video.onplaying = () => {
            requestAnimationFrame(() => resolve());
          };
        });

        document.getElementById("resendBtn").disabled = false;
        await captureCurrentFrame();

      } catch (err) {
        if (err.name === "NotAllowedError") {
          outputBox.innerText = "Capture cancelled or permission denied.";
        } else {
          outputBox.innerText = "Error: " + err.message;
        }
      }
    }

    async function captureCurrentFrame() {
      const keyObj = getNextApiKey();
      const userPrompt = document.getElementById("userPrompt").value.trim();
      const outputBox = document.getElementById("outputBox");
      const previewImg = document.getElementById("previewImg");
      const previewPlaceholder = document.getElementById("previewPlaceholder");
      const video = document.getElementById("video");

      if (!keyObj) {
        outputBox.innerText = "Error: Please configure at least one valid API Key in the API_KEYS array inside the script.";
        return;
      }

      if (!activeStream || !activeStream.active) {
        outputBox.innerText = "No active screen stream. Click 'Select Tab / Screen' first.";
        document.getElementById("resendBtn").disabled = true;
        return;
      }

      try {
        outputBox.innerText = `Capturing frame (Using API Key #${keyObj.index})...`;

        const canvas = document.getElementById("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const base64Data = canvas.toDataURL("image/jpeg", 0.85);
        const base64Clean = base64Data.replace(/^data:image\/jpeg;base64,/, "");

        previewImg.src = base64Data;
        previewImg.classList.remove("hidden");
        previewPlaceholder.classList.add("hidden");

        await callGeminiApi(keyObj.key, keyObj.index, base64Clean, userPrompt);

      } catch (err) {
        outputBox.innerText = "Error capturing frame: " + err.message;
      }
    }

    async function callGeminiApi(apiKey, keyNum, base64Image, promptText, retryCount = 0) {
      const outputBox = document.getElementById("outputBox");
      
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;

      const requestBody = {
        contents: [
          {
            parts: [
              {
                inline_data: {
                  mime_type: "image/jpeg",
                  data: base64Image
                }
              },
              {
                text: promptText
              }
            ]
          }
        ]
      };

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        // If rate limited, auto-fallback/retry
        if (response.status === 429 && retryCount < 3) {
          outputBox.innerText = `Key #${keyNum} hit rate limit. Trying rotation key...`;
          const nextKeyObj = getNextApiKey();
          return callGeminiApi(nextKeyObj.key, nextKeyObj.index, base64Image, promptText, retryCount + 1);
        }

        if (!response.ok) {
          throw new Error(data.error?.message || "Failed to generate content.");
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          const cleanAnswer = reply.trim();
          outputBox.innerText = cleanAnswer;
          autoClickMatchingElement(cleanAnswer);
        } else {
          outputBox.innerText = "No textual response received from Gemini.";
        }
      } catch (err) {
        outputBox.innerText = "API Error: " + err.message;
      }
    }

    function autoClickMatchingElement(targetText) {
      if (!targetText) return;

      const outputBox = document.getElementById("outputBox");
      const normalizedTarget = targetText.toLowerCase().replace(/[^a-z0-9]/g, '');

      const elements = Array.from(document.querySelectorAll("button, label, input[type='radio'], input[type='checkbox'], .option, .choice, [role='button']"));

      let bestMatch = null;
      let highestScore = -1;

      elements.forEach(el => {
        if (el.closest('.w-full.max-w-3xl')) return;

        const textContent = (el.innerText || el.value || "").trim();
        const normalizedElText = textContent.toLowerCase().replace(/[^a-z0-9]/g, '');

        if (!normalizedElText) return;

        if (normalizedElText === normalizedTarget) {
          highestScore = 100;
          bestMatch = el;
          return;
        }

        if (normalizedElText.includes(normalizedTarget) || normalizedTarget.includes(normalizedElText)) {
          const score = Math.min(normalizedElText.length, normalizedTarget.length) / Math.max(normalizedElText.length, normalizedTarget.length) * 80;
          if (score > highestScore) {
            highestScore = score;
            bestMatch = el;
          }
        }
      });

      if (bestMatch && highestScore > 30) {
        bestMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
        bestMatch.click();
        outputBox.innerText += `\n\n[Auto-Clicker]: Clicked matching element ("${(bestMatch.innerText || bestMatch.value || '').trim()}")`;
      } else {
        outputBox.innerText += `\n\n[Auto-Clicker]: No matching DOM element found on current page.`;
      }
    }
  </script>
</body>
</html>
